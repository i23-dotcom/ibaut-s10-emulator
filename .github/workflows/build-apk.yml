- name: Build Android QEMU
  shell: bash
  run: |
    set -euxo pipefail

    cd android-qemu

    echo "===== SYSTEM ====="
    uname -a
    uname -m
    lsb_release -a || true

    echo "===== TOOLS ====="
    gcc --version || true
    clang --version || true
    cmake --version || true
    ninja --version || true
    python3 --version || true
    make --version || true

    echo "===== QEMU TREE ====="
    ls -la
    ls -la android || true

    echo "===== CONFIGURE ====="
    chmod +x android/configure.sh
    chmod +x android/rebuild.sh

    ./android/configure.sh \
      --out-dir="$PWD/objs"

    echo "===== BUILD ====="
    ./android/rebuild.sh \
      --out-dir="$PWD/objs" \
      --verbose
